<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal NBA</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#667085;--line:#e3e6eb;--accent:#1f5fbf;--good:#0a7f4f;--goodbg:#e3f5ec;
  --warn:#9a5b00;--warnbg:#fff1d6;--bad:#b3261e;--badbg:#fde8e6;--chip:#eef1f5;--bar:#c9d3e3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--mute:#98a2b3;--line:#2a2f38;--accent:#7fb0ff;
  --good:#4fd19a;--goodbg:#123326;--warn:#f2b757;--warnbg:#3a2c0f;--bad:#ff8a80;--badbg:#3b1715;--chip:#232830;--bar:#3a4252}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 0;max-width:1180px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--mute);font-size:13px}
main{max-width:1180px;margin:0 auto;padding:0 16px 60px}
nav{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on,.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){nav button.on,.btn.on{color:#0f1115}}
.btn.small{padding:3px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.team{font-weight:650;font-size:16px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mute);white-space:nowrap}
.chip.good{background:var(--goodbg);color:var(--good)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.probbar{height:8px;border-radius:99px;background:var(--bar);overflow:hidden;margin:8px 0 4px;display:flex}
.probbar i{display:block;height:100%;background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px;margin-top:8px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;text-wrap:balance}
details{margin-top:8px}summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.inj{font-size:13px;margin:4px 0 0;padding:0;list-style:none}.inj li{padding:2px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
select,input[type=search],input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);background:var(--card);position:sticky;top:0;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td input[type=number]{width:64px;padding:3px 5px;text-align:right}
td input.manual{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pname{font-weight:600;cursor:pointer}.pname:hover{text-decoration:underline}
.dots{display:inline-flex;gap:2px;vertical-align:middle}.dots i{width:7px;height:7px;border-radius:50%;background:var(--bar);display:inline-block}.dots i.h{background:var(--good)}
.pick{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}.pick .big{font-size:15.5px;font-weight:650}.pick .num{text-align:right;font-variant-numeric:tabular-nums}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.info{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0;color:var(--ink)}
.pos{color:var(--good)}.neg{color:var(--bad)}.mute{color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:760px;width:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.bars{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:6px}.bars div{flex:1;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.h{background:var(--good)}.bars span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--mute)}
.hide{display:none}
ul.plain{padding-left:18px;margin:6px 0}
</style>
</head>

// Réplica exacta de nba_model/daily.py::side_eval y edge_bucket (se comprueba con web/tests/portal_parity.js).
function sideEval(sv, line, decOver, decUnder) {
  const k = Math.floor(line) + 1;
  const at = i => (i > 0 ? (i < sv.length ? sv[i] : 0) : 1);
  const pOver = at(k);
  const pPush = line === Math.floor(line) ? at(k - 1) - pOver : 0;
  const pUnder = 1 - pOver - pPush;
  const out = {p_over: pOver, p_under: pUnder, p_push: pPush};
  if (decOver && decUnder && decOver > 1 && decUnder > 1) {
    const io = 1 / decOver, iu = 1 / decUnder, fo = io / (io + iu);
    const den = Math.max(1e-9, 1 - pPush);
    const eOver = pOver / den - fo, eUnder = pUnder / den - (1 - fo);
    const side = eOver >= eUnder ? "over" : "under";
    const p = side === "over" ? pOver : pUnder, dec = side === "over" ? decOver : decUnder;
    out.fair_over = fo; out.side = side; out.edge = Math.max(eOver, eUnder); out.ev = p * (dec - 1) - (1 - p - pPush);
  }
  return out;
}
function edgeBucket(edge, thresholds) {
  let best = thresholds[0];
  for (const t of thresholds) if (edge >= parseFloat(t)) best = t;
  return best;
}

function allPicks() {
  const out = [];
  for (const p of STATE.players) {
    const g = gameById[p.game_id];
    if (!g || g.state !== "pre") continue;
    for (const m of STATE.markets) {
      const e = evalOf(p, m);
      if (!e || e.edge == null) continue;
      out.push({p, m, e, flags: [].concat(p.status !== "available" ? ["duda"] : [], e.edge >= STATE.big_edge ? ["revisar"] : [])});
    }
  }
  return out.sort((a, b) => b.e.edge - a.e.edge);
}
function evidenceRow(t, x, label) {
  if (!x || !x.n) return `<tr><td>${label}</td><td colspan="3" class="mute">sin datos</td></tr>`;
  return `<tr><td>${label}</td><td>${x.n}</td><td>${pct(x.acierto, 1)}</td><td class="${x.roi >= 0 ? "pos" : "neg"}">${sgn(100 * x.roi)} %${x.lo != null ? ` <span class="mute">[${sgn(100 * x.lo)}; ${sgn(100 * x.hi)}]</span>` : ""}</td></tr>`;
}

      ${STATE.games.map(g => `<tr><td>${esc(gameLabel(g))}</td><td>${sgn(g.model.margin)}</td><td>${g.market.spread_home == null ? "–" : sgn(-g.market.spread_home)}</td><td>${sgn(g.gap_pts)}</td><td>${pct(g.model.prob_home)}</td><td>${pct(g.market.prob_home)}</td><td><span class="chip ${gapReading(g)[1]}">${gapReading(g)[0]}</span></td></tr>`).join("")}

  <div class="card" style="margin-top:12px"><h3>Cómo se calcula la proyección de un jugador</h3><ul class="plain">
    <li><b>Minutos</b>: mezcla de sus minutos recientes y habituales, corregida por bajas de compañeros, plantilla disponible, descanso y riesgo de paliza.</li>
    <li><b>Ritmo por minuto</b>: forma reciente y de temporada, encogida hacia su media de carrera para no creerse una racha de tres partidos.</li>
    <li><b>Contexto</b>: lo que concede el rival, bajas de compañeros (más balón para los que quedan), casa/fuera y el total de puntos que espera el mercado.</li>
    <li><b>Probabilidad</b>: alrededor de esa media se usa una distribución ajustada a la variabilidad real de cada estadística. Los coeficientes se ajustaron solo con 2014-2019 y se comprobaron en 2020-2026.</li></ul>
    ${r.pts ? `<div class="sub">Error (RMSE) en 2022-26: puntos ${num(r.pts.modelo, 2)} (media de temporada ${num(r.pts.temporada, 2)}), rebotes ${num(r.reb.modelo, 2)} (${num(r.reb.temporada, 2)}), asistencias ${num(r.ast.modelo, 2)} (${num(r.ast.temporada, 2)}), triples ${num(r.fg3m.modelo, 2)} (${num(r.fg3m.temporada, 2)}).</div>` : ""}</div>
  <div class="card" style="margin-top:12px"><h3>Límites que conviene tener presentes</h3><ul class="plain">
    <li>La casa sabe más que el modelo: sus líneas fallan algo menos que nuestras proyecciones. ${b.n ? `Aun así el modelo aporta algo propio (peso ${num(b.coef_modelo, 2)} ± ${num(b.se_modelo, 2)} frente a ${num(b.coef_casa, 2)} de la casa en ${b.n} líneas).` : ""}</li>
    <li>El modelo no lee noticias: límites de minutos, cambios de quinteto o molestias que no estén en el parte de ESPN no los ve. Por eso las diferencias enormes se marcan como «revisar».</li>
    <li>Las líneas y cuotas son de DraftKings (EE. UU.). Tu casa tendrá otras: escríbelas en la pestaña Jugadores.</li>
    <li>Si un jugador no juega, la apuesta se anula; si está en «duda», la proyección supone que juega.</li>
    <li>Genera el portal cerca de la hora de los partidos: el parte de lesiones y las líneas cambian durante el día.</li>
    <li>Herramienta de análisis, no asesoramiento. Solo mayores de 18 años. Juego responsable: 900 200 225 (España).</li></ul></div>`;
}

function render() {
  renderHeader();
  for (const t of ["jornada", "jugadores", "picks", "historial", "guia"]) $("#tab-" + t).classList.toggle("hide", ui.tab !== t);
  ({jornada: renderJornada, jugadores: renderJugadores, picks: renderPicks, historial: renderHistorial, guia: renderGuia})[ui.tab]();
}
if (STATE) { STATE.games.forEach(g => { gameById[g.game_id] = g; }); render(); }
else document.querySelector("main").innerHTML = '<div class="card">Esta es la plantilla. Genera el portal con <code>python scripts/portal.py</code>.</div>';
</script>
</body>
</html>
