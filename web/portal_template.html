<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal NBA</title>
<style>
:root{--bg:#f3f5f8;--side:#ffffff;--card:#fff;--card2:#f6f8fb;--ink:#141821;--mute:#5f6b7c;--line:#dfe4ec;--accent:#1f5fbf;--accentbg:#e6eefb;
  --good:#0a7f4f;--goodbg:#e0f4ea;--warn:#8f5400;--warnbg:#fff0d2;--bad:#b3261e;--badbg:#fde8e6;--chip:#edf0f5;--bar:#cbd4e2;--onaccent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--side:#0e1729;--card:#121d33;--card2:#17243f;--ink:#e9edf5;--mute:#93a1b8;--line:#22314f;--accent:#6ea8ff;--accentbg:#17294b;
  --good:#58d6a3;--goodbg:#10362c;--warn:#f2b757;--warnbg:#3a2c0f;--bad:#ff8a80;--badbg:#3b1715;--chip:#1b2946;--bar:#2c3c5e;--onaccent:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:22px 0 10px}h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--mute);font-size:13px}.mute{color:var(--mute)}.pos{color:var(--good)}.neg{color:var(--bad)}.hide{display:none}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* ---- estructura: barra lateral + contenido ---- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.app.mini{grid-template-columns:68px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 14px;font-weight:750;font-size:18px}
.brand b{color:var(--accent)}
.iconbtn{border:0;background:none;color:var(--mute);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex}.iconbtn:hover{background:var(--chip);color:var(--ink)}
.grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:14px 10px 6px;font-weight:650}
.nav a,.nav span.soon{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;color:var(--mute);margin:2px 0;border-left:3px solid transparent}
.nav a:hover{background:var(--chip);color:var(--ink)}
.nav a.on{background:var(--accentbg);color:var(--ink);border-left-color:var(--accent);font-weight:600}
.nav span.soon{opacity:.55;cursor:default}.nav .tag{margin-left:auto;font-size:10px;border:1px solid var(--line);border-radius:99px;padding:0 7px;letter-spacing:.06em}
.nav .cnt{margin-left:auto;font-size:12px;background:var(--chip);border-radius:99px;padding:0 8px}
.side .grow{flex:1}
.app.mini .lbl,.app.mini .grp,.app.mini .tag,.app.mini .cnt,.app.mini .brand .name{display:none}
.app.mini .brand{justify-content:center}.app.mini .nav a,.app.mini .nav span.soon{justify-content:center;padding:10px 0}
.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:6}
.topbar .menu{display:none}
.page{padding:22px 24px 60px;max-width:1240px}
.phead{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.phead .l{display:flex;gap:14px;align-items:center}.phead .pic{width:40px;height:40px;border-radius:10px;background:var(--accentbg);color:var(--accent);display:grid;place-items:center;flex:none}
@media (max-width:880px){
  .app,.app.mini{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:20;width:264px;left:0;transform:translateX(-105%);transition:transform .18s}
  body.navopen .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .app.mini .lbl,.app.mini .grp,.app.mini .tag,.app.mini .cnt,.app.mini .brand .name{display:revert}
  .topbar{padding:10px 16px}.topbar .menu{display:inline-flex}.topbar .meta{display:none}
  .page{padding:16px 16px 60px}.collapse{display:none}
}
/* ---- piezas ---- */
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:9px;cursor:pointer;font:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.small{padding:4px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mute);white-space:nowrap}
.chip.good{background:var(--goodbg);color:var(--good)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;text-wrap:balance}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 12px}
.info{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:12px 0;color:var(--ink)}
details>summary{cursor:pointer;color:var(--accent);font-size:13.5px}
ul.plain{padding-left:18px;margin:6px 0}
.inj{font-size:13px;margin:4px 0 0;padding:0;list-style:none}.inj li{padding:5px 0;border-bottom:1px solid var(--line)}.inj li:last-child{border:0}
select,input[type=search],input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mute);background:var(--card2);user-select:none;font-size:12.5px}th[data-sort]{cursor:pointer}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
td input[type=number]{width:64px;padding:3px 5px;text-align:right}
td input.manual{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pname{font-weight:600;cursor:pointer}.pname:hover{text-decoration:underline}
.dots{display:inline-flex;gap:2px;vertical-align:middle}.dots i{width:7px;height:7px;border-radius:50%;background:var(--bar);display:inline-block}.dots i.h{background:var(--good)}
.badge{display:inline-grid;place-items:center;min-width:38px;height:22px;border-radius:6px;background:var(--chip);font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--mute)}
.star{border:0;background:none;cursor:pointer;color:var(--mute);padding:2px;display:inline-flex}.star.on{color:#e0a82e}.star.on svg{fill:currentColor}
/* pestañas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--mute);font:inherit;padding:9px 13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--good);border-bottom-color:var(--good);font-weight:600}
.pills{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:16px;overflow-x:auto}
.pills button{border:0;background:none;color:var(--ink);font:inherit;font-weight:600;font-size:13.5px;padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.pills button.on{background:var(--accent);color:var(--onaccent)}
/* lista de partidos */
.league{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.league>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card2);color:var(--ink);font-size:15px}
.league>summary::-webkit-details-marker{display:none}
.fx{display:grid;grid-template-columns:74px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.fx:hover{background:var(--card2)}
.fx .t{text-align:center;font-variant-numeric:tabular-nums;border-right:1px solid var(--line);padding-right:12px}
.fx .teams div{display:flex;gap:8px;align-items:center;padding:2px 0;flex-wrap:wrap}
.fx .nums{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}.fx .nums div{padding:2px 0}
.fx .x{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.datepill{background:var(--goodbg);color:var(--good);border-radius:9px;padding:5px 18px;text-align:center;font-weight:700;line-height:1.2}
.datepill small{display:block;font-size:11px;letter-spacing:.1em}
@media (max-width:700px){.fx{grid-template-columns:60px minmax(0,1fr) auto}.fx .x{grid-column:1/-1;justify-content:flex-start}}
/* ficha de partido */
.hero{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.hero .top,.hero .foot{display:flex;justify-content:space-between;gap:10px;padding:10px 18px;font-size:13px;flex-wrap:wrap}
.hero .top{border-bottom:1px solid var(--line);font-weight:650}.hero .foot{border-top:1px solid var(--line);justify-content:center;color:var(--mute);gap:6px 22px}
.hero .mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:24px 12px;gap:10px}
.hero .tm .big{font-size:19px;font-weight:700;margin-top:8px}.hero .tm .badge{min-width:58px;height:44px;border-radius:50%;font-size:14px}
.hero .ko{font-size:34px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .ko small{display:block;font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:600}
/* filtros + resultados */
.split{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.filters label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}.filters label.f:first-child{margin-top:0}
.filters select,.filters input[type=number],.filters input[type=search]{width:100%}
.filters hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.seg{display:flex;gap:5px;flex-wrap:wrap}.seg button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--mute);font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--goodbg);color:var(--good);border-color:transparent;font-weight:650}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin:8px 0;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent)}
.fhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-weight:650}
.fhead button{border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer}
.rtools{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
/* tarjeta de apuesta de jugador */
.bets{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.bet{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bet>div{padding:12px 16px;border-top:1px solid var(--line)}.bet>div:first-child{border-top:0;background:var(--card2);font-size:13px;padding:9px 16px}
.bet .who{font-size:16.5px;font-weight:700}.bet .posb{font-size:11px;background:var(--chip);border-radius:99px;padding:1px 7px;color:var(--mute);vertical-align:middle;font-weight:600}
.bet .odds{text-align:right}.bet .odds b{display:block;font-size:20px;color:var(--good);font-variant-numeric:tabular-nums}
.bet .mk{font-size:18px;font-weight:700;color:var(--good)}
.bet small,.lbls{font-size:12px;color:var(--mute);display:block}
.bet .bigp{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
.segbar{display:inline-flex;gap:2px;vertical-align:middle}.segbar i{width:3px;height:13px;background:var(--bar);border-radius:1px}.segbar i.h{background:var(--good)}
.tiles{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.tiles b{min-width:40px;text-align:center;padding:5px 0;border-radius:7px;background:var(--chip);color:var(--mute);font-variant-numeric:tabular-nums;border-bottom:3px solid var(--bar)}
.tiles b.h{background:var(--goodbg);color:var(--good);border-bottom-color:var(--good)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:760px;width:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.bars{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:6px}.bars div{flex:1;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.h{background:var(--good)}.bars span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--mute)}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <div>
    <div class="topbar"><button class="iconbtn menu" id="menu" aria-label="Abrir navegación"></button><div class="sub" id="hdate"></div><div class="sub meta" id="hmeta"></div></div>
    <main class="page"><div id="warnings"></div><div id="page"></div></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<script>
const STATE = /*__STATE__*/null;

/*CALC-START*/
// Réplica exacta de nba_model/daily.py::side_eval y edge_bucket (se comprueba con web/tests/portal_parity.js).
function sideEval(sv, line, decOver, decUnder) {
  const k = Math.floor(line) + 1;
  const at = i => (i > 0 ? (i < sv.length ? sv[i] : 0) : 1);
  const pOver = at(k);
  const pPush = line === Math.floor(line) ? at(k - 1) - pOver : 0;
  const pUnder = 1 - pOver - pPush;
  const out = {p_over: pOver, p_under: pUnder, p_push: pPush};
  if (decOver && decUnder && decOver > 1 && decUnder > 1) {
    const io = 1 / decOver, iu = 1 / decUnder, fo = io / (io + iu);
    const den = Math.max(1e-9, 1 - pPush);
    const eOver = pOver / den - fo, eUnder = pUnder / den - (1 - fo);
    const side = eOver >= eUnder ? "over" : "under";
    const p = side === "over" ? pOver : pUnder, dec = side === "over" ? decOver : decUnder;
    out.fair_over = fo; out.side = side; out.edge = Math.max(eOver, eUnder); out.ev = p * (dec - 1) - (1 - p - pPush);
  }
  return out;
}
function edgeBucket(edge, thresholds) {
  let best = thresholds[0];
  for (const t of thresholds) if (edge >= parseFloat(t)) best = t;
  return best;
}
/*CALC-END*/
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d) => x == null || isNaN(x) ? "–" : (100 * x).toFixed(d == null ? 0 : d) + " %";
const pp = x => x == null || isNaN(x) ? "–" : (x >= 0 ? "+" : "") + (100 * x).toFixed(1) + " pp";
const num = (x, d) => x == null || isNaN(x) ? "–" : Number(x).toFixed(d == null ? 1 : d);
const sgn = (x, d) => x == null || isNaN(x) ? "–" : (x > 0 ? "+" : "") + Number(x).toFixed(d == null ? 1 : d);
const L = STATE ? STATE.labels : {};
const STATUS = {out: "baja", questionable: "duda", doubtful: "muy dudoso", probable: "probable", available: ""};
const POS = {G: "base/escolta", F: "alero", C: "pívot"};
const gameById = {};
const storeKey = STATE ? "portal-nba-" + STATE.date : "portal-nba";
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let manual = load(storeKey, {});
let favs = load(storeKey + "-fav", {});
const saveManual = () => save(storeKey, manual);

// Estado de la interfaz (filtros de cada página). No se guarda entre sesiones salvo líneas manuales y favoritos.
const DEFAULTS = {
  pb: {market: "all", game: "", side: "all", win: "10", minHit: "", minOdds: "", maxOdds: "", minEdge: "0.06", hideDoubt: false, onePer: true, q: "", sort: "edge", compact: false},
  tb: {game: "", market: "all", minOdds: "", maxOdds: ""},
  ps: {games: [], stat: "pts", mode: "tasa", n: "", win: "10", minRate: "60", pos: ["G", "F", "C"], minMin: "0", venue: ["casa", "fuera"], starters: false, hideDoubt: false, hideStarted: true},
  st: {game: "", market: "pts", q: "", sort: "mu", dir: -1},
  fx: {tab: "jugador"},
};
const ui = JSON.parse(JSON.stringify(DEFAULTS));
const setPath = (path, v) => { const [a, b] = path.split("."); ui[a][b] = v; };
const getPath = path => { const [a, b] = path.split("."); return ui[a][b]; };

const ICONS = {
  cal: "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4", search: "M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM20 20l-4-4",
  user: "M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM5 20c0-3.5 3-6 7-6s7 2.5 7 6",
  users: "M9 11a3.5 3.5 0 1 0 0-7a3.5 3.5 0 0 0 0 7zM2.5 20c0-3 2.8-5.5 6.5-5.5s6.5 2.5 6.5 5.5M16 4.2a3.5 3.5 0 0 1 0 6.6M18 14.8c2 .8 3.5 2.7 3.5 5.2",
  table: "M4 5h16v14H4zM4 10h16M10 5v14", pulse: "M3 12h4l3-7l4 14l3-7h4", chart: "M4 20V10M10 20V4M16 20v-8M21 20H3",
  book: "M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11",
  star: "M12 3.5l2.6 5.4l5.9.8l-4.3 4.1l1 5.9L12 16.9l-5.2 2.8l1-5.9L3.5 9.7l5.9-.8z",
  menu: "M4 6h16M4 12h16M4 18h16", chev: "M15 6l-6 6l6 6", arrow: "M5 12h14M13 6l6 6l-6 6", list: "M4 7h16M4 12h16M4 17h16",
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;

// Páginas: [id, etiqueta, icono, grupo, título, subtítulo]
const PAGES = [
  ["partidos", "Partidos", "cal", "Jornada", "Partidos", "La jornada de hoy: horarios, marcadores, probabilidad del modelo y lo que dice el mercado."],
  ["buscador", "Buscador de props", "search", "Análisis", "Buscador de props", "Encuentra jugadores que cumplen tu criterio en sus últimos partidos: puntos, rebotes, asistencias, triples y combinadas."],
  ["jugadores", "Apuestas de jugador", "user", "Análisis", "Apuestas de jugador", "Cada línea con precio: cuota, probabilidad del modelo frente a la casa y forma reciente."],
  ["equipos", "Apuestas de equipo", "users", "Análisis", "Apuestas de equipo", "Ganador, hándicap y total de cada partido: cuota de la casa frente a la probabilidad del modelo."],
  ["proyecciones", "Proyecciones", "table", "Análisis", "Proyecciones de jugadores", "La tabla completa de proyecciones. Escribe la línea y las cuotas de tu casa para recalcular al momento."],
  ["historial", "Historial", "chart", "Seguimiento", "Historial", "Lo que acertaron de verdad las predicciones de los días anteriores."],
  ["guia", "Cómo leerlo", "book", "Seguimiento", "Cómo leerlo", "Qué hace cada página, cómo se calcula y qué límites tiene."],
];
const SOON = [["Probabilidad en directo", "pulse", "Análisis"]];

function route() {
  const h = (location.hash || "#/partidos").replace(/^#\/?/, "").split("/");
  return {page: h[0] || "partidos", arg: h[1] || ""};
}

// Línea vigente de un jugador y mercado: la escrita a mano si existe; si no, la de DraftKings.
function lineOf(pl, m) {
  const mk = pl.markets[m], base = mk.line || null, man = manual[pl.pid + "|" + m];
  if (man && man.line != null) {
    return {value: man.line, over: man.over != null ? man.over : (base && base.side_ok ? base.over : null),
            under: man.under != null ? man.under : (base && base.side_ok ? base.under : null), manual: true};

function teamRows(fixed, all) {
  const f = ui.tb, out = [];
  for (const g of STATE.games) {
    if (fixed ? g.game_id !== fixed : (f.game && g.game_id !== f.game)) continue;
    const m = g.model, k = g.market, home = m.prob_home >= 0.5;
    if (k.ml_home && k.ml_away) out.push({g, kind: "ganador", name: "Ganador: " + (home ? g.home : g.away), price: home ? k.ml_home : k.ml_away, pm: home ? m.prob_home : 1 - m.prob_home,
      pk: k.prob_home == null ? null : (home ? k.prob_home : 1 - k.prob_home)});
    if (k.spread_home != null && m.p_cover_home != null) { const c = m.p_cover_home >= 0.5;
      out.push({g, kind: "handicap", name: "Hándicap: " + (c ? g.home + " " + sgn(k.spread_home) : g.away + " " + sgn(-k.spread_home)), price: c ? k.spread_odds_home : k.spread_odds_away, pm: c ? m.p_cover_home : 1 - m.p_cover_home, pk: null}); }
    if (k.total != null) out.push({g, kind: "total", name: "Total de puntos " + num(k.total), price: null, pm: null, pk: null, extra: k.over_odds ? `más ${num(k.over_odds, 2)} / menos ${num(k.under_odds, 2)}` : ""});
  }
  if (all) return out;                                       // favoritos: sin los filtros de la página de equipos
  const lo = parseFloat(f.minOdds), hi = parseFloat(f.maxOdds);
  return out.filter(x => (f.market === "all" || x.kind === f.market) && (isNaN(lo) || (x.price != null && x.price >= lo)) && (isNaN(hi) || (x.price != null && x.price <= hi)));
}

// ---------------------------------------------------------------- Buscador de props
function searchRows() {
  const f = ui.ps, win = parseInt(f.win, 10), n = parseFloat(f.n), minRate = parseFloat(f.minRate), minMin = parseFloat(f.minMin) || 0, out = [];
  if (isNaN(n)) return null;
  for (const p of STATE.players) {
    const g = gameById[p.game_id];
    if (!g || (f.games.length && !f.games.includes(p.game_id)) || (f.hideStarted && g.state !== "pre")) continue;
    if (!f.pos.includes(p.pos) || p.min < minMin || !f.venue.includes(p.home ? "casa" : "fuera")) continue;
    if ((f.starters && p.start_rate < 0.5) || (f.hideDoubt && p.status !== "available")) continue;
    const mk = p.markets[f.stat], vals = mk.last.slice(-win);
    if (!vals.length) continue;
    const h = vals.filter(v => v >= n).length, avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    if (f.mode === "tasa" ? 100 * h / vals.length < minRate : avg < n) continue;
    out.push({p, g, mk, vals, h, avg, pm: sideEval(mk.sv, n - 0.5, null, null).p_over});      // P(X >= n) = P(X > n - 0,5)
  }
  return out.sort((a, b) => f.mode === "tasa" ? (b.h / b.vals.length - a.h / a.vals.length) || (b.pm - a.pm) : b.avg - a.avg);
}

      <div class="tablewrap"><table><thead><tr><th></th><th class="l">Jugador</th><th class="l">Partido</th><th>Min proy.</th><th>Acierto</th><th class="l">Últimos (reciente primero)</th><th>Media</th><th>Proyección</th><th title="Probabilidad del modelo de llegar a esa cifra esta noche">P modelo</th><th>Línea casa</th></tr></thead><tbody>${rows.map(r => {

function renderHistorial(el) {
  const t = STATE.track || {days: 0};
  if (!t.days) { el.innerHTML = pageHead("historial") + `<div class="card"><h3>Todavía no hay historial</h3><div class="sub">Cada vez que generas el portal se guardan las predicciones del día en <code>data/predictions/</code>. A partir de mañana, aquí verás cuánto acertaron de verdad (líneas y precios tal como estaban cuando lo generaste).</div></div>`; return; }
  const pk = t.picks || {}, er = t.error || {}, gm = t.games;
  el.innerHTML = pageHead("historial") + `<div class="sub">Predicciones guardadas de ${t.days} día(s), del ${esc(t.from)} al ${esc(t.to)} · ${t.n_lines || 0} líneas de jugador puntuadas (las de jugadores que no jugaron se anulan).</div>
    <h2>Apuestas de jugador siguiendo al modelo</h2>
    <div class="tablewrap"><table><thead><tr><th>Ventaja mínima</th><th>Apuestas</th><th>Acierto</th><th>Rentabilidad</th><th>Unidades</th></tr></thead><tbody>
    ${STATE.thresholds.map(k => { const x = pk[k]; return !x || !x.n ? `<tr><td>≥ ${(100 * parseFloat(k)).toFixed(0)} pp</td><td colspan="4" class="mute">sin apuestas</td></tr>` : `<tr><td>≥ ${(100 * parseFloat(k)).toFixed(0)} pp</td><td>${x.n}</td><td>${pct(x.acierto, 1)}</td><td class="${x.roi >= 0 ? "pos" : "neg"}">${sgn(100 * x.roi)} %</td><td class="${x.unidades >= 0 ? "pos" : "neg"}">${sgn(x.unidades, 2)}</td></tr>`; }).join("")}
    </tbody></table></div>
    <h2>Error de la proyección frente a la línea de la casa</h2>
    <div class="tablewrap"><table><thead><tr><th>Mercado</th><th>Líneas</th><th>Error medio del modelo</th><th>Error medio de la línea</th></tr></thead><tbody>
    ${STATE.markets.filter(m => er[m]).map(m => `<tr><td>${esc(L[m])}</td><td>${er[m].n}</td><td>${num(er[m].mae_modelo, 2)}</td><td>${num(er[m].mae_linea, 2)}</td></tr>`).join("")}
    </tbody></table></div>
    ${gm ? `<h2>Partidos</h2><div class="card">En ${gm.n} partidos: el modelo acertó el ganador el ${pct(gm.acierto_modelo, 1)} y el mercado el ${pct(gm.acierto_mercado, 1)}. Log loss (menor es mejor): modelo ${num(gm.log_loss_modelo, 4)}, mercado ${num(gm.log_loss_mercado, 4)}.</div>` : ""}
    <div class="info">Con pocas semanas de datos estas cifras se mueven mucho por pura suerte: hacen falta varios cientos de apuestas para sacar conclusiones.</div>`;
}
function renderGuia(el) {
  const ev = STATE.evidence.props || {}, r = ev.test_rmse || {}, b = ev.blend || {};
  el.innerHTML = pageHead("guia") + `<div class="card"><h3>Qué hace cada página</h3><ul class="plain">
    <li><b>Partidos</b>: la jornada con la probabilidad del modelo y la lectura frente al mercado (DraftKings, vía ESPN). Al abrir un partido ves sus apuestas de jugador y de equipo, las proyecciones, el desglose del modelo y las bajas.</li>
    <li><b>Buscador de props</b>: jugadores que han llegado a una cifra en sus últimos partidos, con la probabilidad del modelo para esta noche.</li>
    <li><b>Apuestas de jugador</b>: las líneas con precio, con la probabilidad del modelo, la de la casa y el historial real de ese nivel de ventaja.</li>
    <li><b>Apuestas de equipo</b>: ganador, hándicap y total de cada partido. No son recomendaciones.</li>
    <li><b>Proyecciones</b>: la tabla completa, donde puedes escribir la línea y las cuotas de tu casa.</li>
    <li><b>Favoritos</b>: lo que marcas con la estrella. <b>Historial</b>: lo que acertaron de verdad las predicciones de los días anteriores.</li></ul></div>
  <div class="card" style="margin-top:12px"><h3>Cómo se calcula la proyección de un jugador</h3><ul class="plain">
    <li><b>Minutos</b>: mezcla de sus minutos recientes y habituales, corregida por bajas de compañeros, plantilla disponible, descanso y riesgo de paliza.</li>
    <li><b>Ritmo por minuto</b>: forma reciente y de temporada, encogida hacia su media de carrera para no creerse una racha de tres partidos.</li>
    <li><b>Contexto</b>: lo que concede el rival, bajas de compañeros (más balón para los que quedan), casa/fuera y el total de puntos que espera el mercado.</li>
    <li><b>Probabilidad</b>: alrededor de esa media se usa una distribución ajustada a la variabilidad real de cada estadística. Los coeficientes se ajustaron solo con 2014-2019 y se comprobaron en 2020-2026.</li></ul>
    ${r.pts ? `<div class="sub">Error (RMSE) en 2022-26: puntos ${num(r.pts.modelo, 2)} (media de temporada ${num(r.pts.temporada, 2)}), rebotes ${num(r.reb.modelo, 2)} (${num(r.reb.temporada, 2)}), asistencias ${num(r.ast.modelo, 2)} (${num(r.ast.temporada, 2)}), triples ${num(r.fg3m.modelo, 2)} (${num(r.fg3m.temporada, 2)}).</div>` : ""}</div>
  <div class="card" style="margin-top:12px"><h3>Límites que conviene tener presentes</h3><ul class="plain">
    <li>La casa sabe más que el modelo: sus líneas fallan algo menos que nuestras proyecciones. ${b.n ? `Aun así el modelo aporta algo propio (peso ${num(b.coef_modelo, 2)} ± ${num(b.se_modelo, 2)} frente a ${num(b.coef_casa, 2)} de la casa en ${b.n} líneas).` : ""}</li>
    <li>El «acierto» y la «racha» de los últimos partidos son descriptivos: con 5 o 10 partidos, una racha perfecta es casi siempre suerte. La ventana es fija a propósito, no la que mejor queda para cada jugador.</li>
    <li>El modelo no lee noticias: límites de minutos, cambios de quinteto o molestias que no estén en el parte de ESPN no los ve. Por eso las diferencias enormes se marcan como «revisar».</li>
    <li>Las líneas y cuotas son de DraftKings (EE. UU.). Tu casa tendrá otras: escríbelas en la página Proyecciones.</li>
    <li>Si un jugador no juega, la apuesta se anula; si está en «duda», la proyección supone que juega.</li>
    <li>Genera el portal cerca de la hora de los partidos: el parte de lesiones y las líneas cambian durante el día.</li>
    <li>Herramienta de análisis, no asesoramiento. Solo mayores de 18 años. Juego responsable: 900 200 225 (España).</li></ul></div>`;
}

// ---------------------------------------------------------------- render y eventos
function render() {
  const r = route(), el = $("#page");
  renderShell();
  if (r.page === "partido") renderPartido(el, r.arg);
  else if (r.page === "buscador") renderBuscador(el);
  else if (r.page === "jugadores") el.innerHTML = pageHead("jugadores", updated()) + playerBetsHtml("");
  else if (r.page === "equipos") el.innerHTML = pageHead("equipos", updated()) + teamBetsHtml("");
  else if (r.page === "proyecciones") el.innerHTML = pageHead("proyecciones", updated()) + statsHtml("");
  else if (r.page === "favoritos") renderFavoritos(el);
  else if (r.page === "historial") renderHistorial(el);
  else if (r.page === "guia") renderGuia(el);
  else renderPartidos(el);
}
function bindEvents() {
  window.addEventListener("hashchange", () => { document.body.classList.remove("navopen"); render(); window.scrollTo(0, 0); });
  document.addEventListener("click", e => {
    const t = e.target;
    if (t.closest("#menu")) { document.body.classList.toggle("navopen"); return; }
    if (document.body.classList.contains("navopen") && !t.closest("#side")) document.body.classList.remove("navopen");
    if (t.closest("#collapse")) { const mini = $("#app").classList.toggle("mini"); save("portal-nba-mini", {v: mini}); return; }
    let b;
    if ((b = t.closest("[data-fav]"))) { e.preventDefault(); const k = b.dataset.fav; if (favs[k]) delete favs[k]; else favs[k] = 1; save(storeKey + "-fav", favs); render(); return; }
    if ((b = t.closest("[data-set]"))) { setPath(b.dataset.set, b.dataset.v); render(); return; }
    if ((b = t.closest("[data-toggle]"))) { setPath(b.dataset.toggle, !getPath(b.dataset.toggle)); render(); return; }
    if ((b = t.closest("[data-tog]"))) { const a = getPath(b.dataset.tog), i = a.indexOf(b.dataset.v); if (i < 0) a.push(b.dataset.v); else a.splice(i, 1); render(); return; }
    if ((b = t.closest("[data-reset]"))) { ui[b.dataset.reset] = JSON.parse(JSON.stringify(DEFAULTS[b.dataset.reset])); render(); return; }
    if ((b = t.closest("th[data-sort]"))) { const f = ui.st, k = b.dataset.sort; if (f.sort === k) f.dir = -f.dir; else { f.sort = k; f.dir = k === "name" ? 1 : -1; } render(); return; }
    if ((b = t.closest(".pname[data-pid]"))) { openPlayer(Number(b.dataset.pid)); return; }
    if (t.closest("#clearman")) { manual = {}; saveManual(); render(); return; }
    if (t.closest("#clearfav")) { favs = {}; save(storeKey + "-fav", favs); render(); }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.matches("input[data-k]")) {                          // línea o cuota escrita a mano en la tabla de proyecciones
      const k = t.dataset.k, f = t.dataset.f, v = t.value === "" ? null : parseFloat(t.value), cur = manual[k] || {};
      if (f === "line" && v == null) { delete manual[k]; }
      else {
        if (cur.line == null && f !== "line") {                // cuota manual sobre la línea de DraftKings
          const [pid, mm] = k.split("|"), pl = STATE.players.find(x => String(x.pid) === pid), base = pl.markets[mm].line;
          if (!base) return;
          cur.line = base.value;
        }
        cur[f] = v; manual[k] = cur;
      }
      saveManual(); render(); return;
    }
    if (t.matches("[data-arr]")) { const a = getPath(t.dataset.arr), i = a.indexOf(t.value); if (t.checked && i < 0) a.push(t.value); if (!t.checked && i >= 0) a.splice(i, 1); render(); return; }
    if (t.matches("[data-ui]")) { setPath(t.dataset.ui, t.type === "checkbox" ? t.checked : t.value); render(); }
  });
  document.addEventListener("input", e => {
    const t = e.target;
    if (!t.matches("[data-live]")) return;
    setPath(t.dataset.live, t.value);
    const id = t.id, pos = t.selectionStart;
    render();
    const n = document.getElementById(id);
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} }
  });
}
if (STATE) {
  STATE.games.forEach(g => { gameById[g.game_id] = g; });
  if (load("portal-nba-mini", {}).v) $("#app").classList.add("mini");
  bindEvents(); render();
} else document.querySelector("#page").innerHTML = '<div class="card">Esta es la plantilla. Genera el portal con <code>python scripts/portal.py</code>.</div>';
</script>
